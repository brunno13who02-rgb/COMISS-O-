<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilha Financeira Elegance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--bg:#f8fafc;
--card:#ffffff;
--card-inner:#fafafa;
--text:#1e293b;
--text-light:#64748b;
--primary:#0f172a;
--primary-accent:#3b82f6;
--border:#e2e8f0;
--shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
--table-th:#f1f5f9;
--table-hover:#f8fafc;
}

body.dark-mode{
--bg:#07111f;
--card:#0f172a;
--card-inner:#132238;
--text:#ffffff;
--text-light:#94a3b8;
--primary:#2563eb;
--primary-accent:#60a5fa;
--border:rgba(96,165,250,0.25);
--shadow: 0 10px 30px rgba(0,0,0,0.5);
--table-th:#132238;
--table-hover:rgba(96,165,250,0.08);
}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
transition: background 0.3s ease, color 0.3s ease;
}

header{
background:var(--card);
padding:20px 24px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--border);
box-shadow:var(--shadow);
}

header h1{
font-size:22px;
font-weight:600;
color:var(--text);
}

.theme-toggle{
background:transparent;
border:1px solid var(--border);
color:var(--text);
padding:8px 14px;
border-radius:20px;
cursor:pointer;
font-size:13px;
font-weight:500;
transition:0.3s;
display:flex;
align-items:center;
gap:6px;
}

.theme-toggle:hover{
border-color:var(--primary-accent);
color:var(--primary-accent);
}

nav{
display:flex;
justify-content:center;
gap:12px;
padding:25px 20px;
}

nav button{
background:transparent;
border:1px solid var(--border);
color:var(--text-light);
padding:10px 24px;
cursor:pointer;
font-size:14px;
border-radius:20px;
transition:all 0.3s ease;
font-weight:500;
}

nav button:hover{
border-color:var(--primary-accent);
color:var(--text);
}

nav button.active{
background:var(--primary-accent);
color:#ffffff;
border-color:var(--primary-accent);
box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
}

.container{
max-width:900px;
margin:0 auto 40px auto;
padding:30px;
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
box-shadow:var(--shadow);
animation:fadeIn 0.4s ease;
transition: background 0.3s ease, border 0.3s ease;
}

.hidden{
display:none;
}

h2{
margin-bottom:20px;
font-weight:600;
color:var(--text);
font-size:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:var(--card-inner);
border:1px solid var(--border);
padding:22px;
border-radius:16px;
transition:0.3s;
}

.card h3{
font-size:13px;
color:var(--text-light);
margin-bottom:8px;
font-weight:400;
}

.card p{
font-size:24px;
font-weight:600;
color:var(--primary-accent);
}

label{
font-size:13px;
color:var(--text-light);
display: block;
margin-bottom: 6px;
font-weight: 500;
}

input, select{
width:100%;
padding:14px 16px;
margin-bottom:18px;
border:1px solid var(--border);
border-radius:12px;
background:var(--card);
color:var(--text);
outline:none;
transition:0.3s;
font-size:14px;
}

select option {
background: var(--card);
color: var(--text);
}

input:focus, select:focus{
border-color:var(--primary-accent);
box-shadow:0 0 0 3px rgba(59, 130, 246, 0.15);
}

button.action-btn{
background:var(--primary-accent);
color:#ffffff;
border:none;
padding:13px 24px;
border-radius:12px;
cursor:pointer;
transition:0.3s;
font-weight:500;
font-size:14px;
width:100%;
}

button.action-btn:hover{
opacity:0.9;
transform:translateY(-1px);
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
overflow:hidden;
border-radius:12px;
}

th,td{
padding:14px;
text-align:center;
font-size:14px;
}

th{
background:var(--table-th);
color:var(--text);
font-weight:600;
border-bottom:1px solid var(--border);
}

tbody tr{
border-bottom:1px solid var(--border);
transition:0.2s;
}

tbody tr:hover{
background:var(--table-hover);
}

tfoot td{
font-weight:600;
background:var(--table-th);
border-top:1px solid var(--border);
}

@media(max-width:700px){
.container{
margin:10px;
padding:15px;
}
header h1{
font-size:18px;
}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<header>
    <h1>Planilha Financeira</h1>
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">Modo Escuro</span>
    </button>
</header>

<nav>
<button class="active" onclick="showPage('entrada',event)">Entrada</button>
<button onclick="showPage('relatorio',event)">Relatórios</button>
</nav>

<div class="container" id="entrada">

<div class="dashboard"></div>

<!-- Bloco de Comissão Estilizado -->
<div class="card" style="margin-bottom: 25px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px;">
        <div style="font-size: 16px; font-weight: 500; color: var(--text);">Comissão (%)</div>
        <div style="display: flex; flex-direction: column; gap: 8px; width: 130px;">
            <input type="number" id="porcCalculadora" step="0.01" placeholder="%" style="margin-bottom: 0; padding: 10px; text-align: center;">
            <button class="action-btn" onclick="calcularComissao()" style="padding: 10px; font-size: 13px;">Calcular</button>
        </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px;">
        <div style="font-size: 15px; font-weight: 500; color: var(--text);">Valor da Comissão</div>
        <div id="resultadoComissao" style="font-size: 18px; font-weight: 600; color: var(--primary-accent);">—</div>
    </div>
</div>

<h2>Novo Lançamento</h2>

<label>Mês/Ano</label>
<input type="month" id="mesAno">

<label>Valor</label>
<input type="number" id="valor" step="0.01">

<button class="action-btn" onclick="salvar()">Salvar Lançamento</button>

</div>

<div class="container hidden" id="relatorio">

<h2>Relatórios</h2>

<label>Selecionar Mês:</label>
<select id="filtroRelatorio" onchange="mudarRelatorio(this.value)"></select>

<div id="conteudoRelatorio" style="max-height: 400px; overflow-y: auto; padding-right: 4px; margin-top: 15px;"></div>

</div>

<script>

// Inicialização e Gerenciamento de Tema
function verificarTemaSalvo() {
    const temaSalvo = localStorage.getItem("theme");
    if (temaSalvo === "dark") {
        document.body.classList.add("dark-mode");
        document.getElementById("themeIcon").innerText = "☀️";
        document.getElementById("themeText").innerText = "Modo Claro";
    }
}

function toggleTheme() {
    document.body.classList.toggle("dark-mode");
    const isDark = document.body.classList.contains("dark-mode");
    
    if (isDark) {
        localStorage.setItem("theme", "dark");
        document.getElementById("themeIcon").innerText = "☀️";
        document.getElementById("themeText").innerText = "Modo Claro";
    } else {
        localStorage.setItem("theme", "light");
        document.getElementById("themeIcon").innerText = "🌙";
        document.getElementById("themeText").innerText = "Modo Escuro";
    }
}

verificarTemaSalvo();

function carregar(){
const dados = localStorage.getItem("dados");
return dados ? JSON.parse(dados) : {};
}

function salvarDados(d){
localStorage.setItem("dados",JSON.stringify(d));
}

let registros = carregar();
let mesFiltroDashboard = "";

atualizarDashboard();

function showPage(page,event){
document.getElementById("entrada").classList.add("hidden");
document.getElementById("relatorio").classList.add("hidden");

document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
document.getElementById(page).classList.remove("hidden");
event.target.classList.add("active");

if(page==="relatorio"){
atualizarRelatorio();
}
}

function salvar(){
const mes = document.getElementById("mesAno").value;
const valor = parseFloat(document.getElementById("valor").value);

if(!mes || isNaN(valor)){
alert("Preencha os campos corretamente.");
return;
}

if(!registros[mes]){
registros[mes] = [];
}

registros[mes].push(valor);
salvarDados(registros);

document.getElementById("mesAno").value="";
document.getElementById("valor").value="";

mesFiltroDashboard = mes;

atualizarDashboard();
alert("Valor salvo com sucesso!");
}

function atualizarDashboard(){
const db = document.querySelector(".dashboard");
const mesesDisponiveis = Object.keys(registros).sort().reverse();

if (!mesFiltroDashboard || !registros[mesFiltroDashboard]) {
    mesFiltroDashboard = mesesDisponiveis[0] || "";
}

let totalMes = 0;
let totalLancamentos = 0;

if (mesFiltroDashboard && registros[mesFiltroDashboard]) {
    totalMes = registros[mesFiltroDashboard].reduce((a, b) => a + b, 0);
    totalLancamentos = registros[mesFiltroDashboard].length;
}

const media = totalLancamentos > 0 ? (totalMes / totalLancamentos) : 0;

let options = mesesDisponiveis.map(m => `<option value="${m}" ${m === mesFiltroDashboard ? 'selected' : ''}>${m}</option>`).join("");
if (mesesDisponiveis.length === 0) {
    options = `<option value="">Nenhum dado lançado</option>`;
}

db.innerHTML = `
    <div style="grid-column: 1 / -1; margin-bottom: -5px;">
        <label>Visualizar Métricas do Mês:</label>
        <select id="filtroMesDash" onchange="mudarMesDashboard(this.value)">
            ${options}
        </select>
    </div>
    <div class="card">
        <h3>Total Acumulado</h3>
        <p>R$ ${totalMes.toFixed(2)}</p>
    </div>
    <div class="card">
        <h3>Nº de Lançamentos</h3>
        <p>${totalLancamentos}</p>
    </div>
    <div class="card">
        <h3>Média por Registro</h3>
        <p>R$ ${media.toFixed(2)}</p>
    </div>
`;
}

function mudarMesDashboard(mes) {
    mesFiltroDashboard = mes;
    atualizarDashboard();
}

function calcularComissao() {
    if(!mesFiltroDashboard || !registros[mesFiltroDashboard]){
        document.getElementById("resultadoComissao").innerText = "—";
        alert("Nenhum mês selecionado ou com dados.");
        return;
    }
    
    const totalMes = registros[mesFiltroDashboard].reduce((a, b) => a + b, 0);
    const porc = parseFloat(document.getElementById("porcCalculadora").value);
    const resDiv = document.getElementById("resultadoComissao");

    if(isNaN(porc)){
        resDiv.innerText = "—";
        alert("Digite a porcentagem corretamente.");
        return;
    }

    const comissao = totalMes * porc / 100;
    resDiv.innerText = "R$ " + comissao.toFixed(2);
}

function atualizarRelatorio(){
const select = document.getElementById("filtroRelatorio");
const conteudo = document.getElementById("conteudoRelatorio");

select.innerHTML = "";
conteudo.innerHTML = "";

const meses = Object.keys(registros).sort().reverse();

if(meses.length === 0){
    select.innerHTML = `<option value="">Nenhum dado lançado</option>`;
    conteudo.innerHTML = `<p style="text-align:center; color:var(--text-light); padding: 20px;">Nenhum registro encontrado.</p>`;
    return;
}

meses.forEach(mes => {
    const opt = document.createElement("option");
    opt.value = mes;
    opt.innerText = mes;
    select.appendChild(opt);
});

meses.forEach((mes, index) => {
    const div = document.createElement("div");
    div.id = "rel-mes-" + mes;
    if(index !== 0){
        div.classList.add("hidden");
    }

    let linhas="";
    registros[mes].forEach((v, idx)=>{
        linhas += `
        <tr>
            <td>${mes}</td>
            <td>R$ ${v.toFixed(2)}</td>
            <td>
                <button onclick="excluirLancamento('${mes}', ${idx})" style="background: #ef4444; color: #fff; border:none; padding: 6px 12px; font-size: 12px; border-radius: 8px; cursor: pointer;">
                    Excluir
                </button>
            </td>
        </tr>
        `;
    });

    const total = registros[mes].reduce((a,b)=>a+b,0);

    div.innerHTML = `
    <table>
        <thead>
            <tr>
                <th>Mês</th>
                <th>Valor</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            ${linhas}
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2" style="text-align: left; padding-left: 20px;">Total do Mês</td>
                <td>R$ ${total.toFixed(2)}</td>
            </tr>
        </tfoot>
    </table>
    `;

    conteudo.appendChild(div);
});
}

function mudarRelatorio(mes){
document.querySelectorAll("#conteudoRelatorio > div").forEach(d => d.classList.add("hidden"));
const alvo = document.getElementById("rel-mes-" + mes);
if(alvo){
    alvo.classList.remove("hidden");
}
}

function excluirLancamento(mes, index){
if(confirm("Tem certeza que deseja excluir este lançamento?")){
    registros[mes].splice(index, 1);
    
    if(registros[mes].length === 0){
        delete registros[mes];
    }
    
    salvarDados(registros);
    atualizarDashboard();
    atualizarRelatorio();
}
}

</script>

</body>
</html>
